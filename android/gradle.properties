# ─── Version de l'appli ──────────────────────────────────────────────────────
# Seul endroit à modifier pour une nouvelle version visible (« 1.1.0 »).
# Le numéro interne (versionCode, qui doit toujours augmenter pour qu'Android
# accepte une mise à jour) est calculé par build-apk.sh : nombre de commits git.
arrmada.versionName=1.0.0

# ─── Gradle ──────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
