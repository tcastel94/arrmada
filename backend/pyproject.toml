[tool.pytest.ini_options]
asyncio_mode = "auto"
# Rend le package `app` importable avec un simple `pytest` (commande de la CI),
# pas seulement avec `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# FastAPI déclare ses dépendances par des appels en valeur par défaut
# (`db = Depends(get_db)`, `q = Query(...)`) : c'est l'idiome officiel, pas
# le piège que B008 cherche (objet mutable partagé entre appels).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
    "fastapi.Security", "fastapi.params.Depends", "fastapi.params.Query",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "app/services/media_mover.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Niveau réel mesuré (31 %) : le seuil de 40 % n'avait jamais été appliqué,
# l'étape s'arrêtait au lint ruff. À remonter au fil des nouveaux tests.
fail_under = 30

[project]
name = "arrmada-backend"
version = "0.1.0"
requires-python = ">=3.11"
