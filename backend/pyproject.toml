[tool.pytest.ini_options]
# Ajoute backend/ au PYTHONPATH : sans ça, la commande `pytest` (utilisée par
# la CI) ne trouve pas le paquet `app` — seul `python -m pytest` fonctionnait.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    # SQLAlchemy : `Service.is_enabled == True` construit une clause SQL
    # (WHERE is_enabled = 1). La « correction » proposée (`is True`) casserait
    # silencieusement la requête → règle désactivée plutôt qu'un noqa par ligne.
    "E712",
]

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI : `db = Depends(get_db)` / `q = Query(...)` dans la signature
# est LA façon officielle de déclarer une dépendance. B008 le prend pour un
# appel de fonction exécuté une seule fois au chargement → faux positif.
# On déclare ces appels comme « immuables » plutôt que de couper B008 partout.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "app/services/media_mover.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 40

[project]
name = "arrmada-backend"
version = "0.1.0"
requires-python = ">=3.11"
