# ╔════════════════════════════════════════════════════════════╗
# ║                 ArrMada — installation                     ║
# ╚════════════════════════════════════════════════════════════╝
#
#   1. Copie ce fichier dans un dossier vide (ex : /opt/arrmada,
#      /volume1/docker/arrmada sur Synology, /mnt/user/appdata/arrmada…)
#   2. docker compose up -d
#   3. Ouvre http://<ip-de-la-machine>:3420 → l'assistant fait le reste
#      (mot de passe admin, détection de tes services *arr, clés API).
#
# Aucun fichier .env n'est nécessaire. Mise à jour :
#   docker compose pull && docker compose up -d
#
# Synology (DSM 7.2+) : Container Manager → Projet → Créer → colle ce fichier.
# Base PostgreSQL au lieu de SQLite : voir docker-compose.postgres.yml.

name: arrmada

services:
  arrmada:
    image: ghcr.io/tcastel94/arrmada:latest
    container_name: arrmada
    restart: unless-stopped
    init: true                 # mini-init Docker : signaux + processus zombies
    ports:
      - "3420:3420"            # interface + API : le SEUL port à ouvrir
    volumes:
      - ./data:/app/data       # base SQLite, clés de chiffrement, mot de passe haché
      # Optionnel : accès aux fichiers médias (nettoyage, doublons…).
      # - /chemin/vers/medias:/mnt/user:rw
    environment:
      - TZ=${TZ:-Europe/Paris}
      # Propriétaire des fichiers créés dans ./data (commande `id` sur l'hôte).
      # Synology : souvent 1026/100 — Unraid : 99/100.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # ── Optionnel (vide = désactivé) ──
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
