services:
  # ── Backend (FastAPI) ───────────────────────────────────────
  arrmada-backend:
    build: ./backend
    container_name: arrmada-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8420}:8000"
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
      # Add-on Kodi servi en dépôt (/kodi/repo) : un `git pull` suffit pour
      # proposer la nouvelle version aux TV, sans reconstruire l'image.
      - ./kodi-addon:/app/kodi-addon:ro
      - /mnt/user:/mnt/user:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://arrmada:${POSTGRES_PASSWORD:-arrmada}@arrmada-db:5432/arrmada}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3420,http://192.168.2.3:3420}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-}
      - ARRMADA_AUTH_SECRET=${ARRMADA_AUTH_SECRET:-changeme}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-google/gemini-2.0-flash-001}
      - UNRAID_URL=${UNRAID_URL:-}
      - UNRAID_API_KEY=${UNRAID_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Caméras Eufy (pop-up sur la TV) : adresse de eufy-security-ws
      - EUFY_WS_URL=${EUFY_WS_URL:-}
      - EUFY_DETECTIONS=${EUFY_DETECTIONS:-person}
      # Artworks : fanart.tv (clé personnelle d'un compte gratuit et/ou clé de
      # projet), images des dossiers des médias, tâche quotidienne.
      # ⚠️ Une variable du .env n'arrive dans le conteneur QUE si elle est
      # listée ici (docker compose ne s'en sert sinon que pour ce fichier).
      - FANART_API_KEY=${FANART_API_KEY:-}
      - FANART_CLIENT_KEY=${FANART_CLIENT_KEY:-}
      - ARTWORK_LOCAL_ENABLED=${ARTWORK_LOCAL_ENABLED:-true}
      - ARTWORK_AUTO_ENABLED=${ARTWORK_AUTO_ENABLED:-true}
      - ARTWORK_AUTO_INTERVAL_HOURS=${ARTWORK_AUTO_INTERVAL_HOURS:-24}
      # Auto-import (téléchargements terminés non importés, packs bloqués)
      - AUTO_IMPORT_ENABLED=${AUTO_IMPORT_ENABLED:-true}
      - AUTO_IMPORT_INTERVAL_MINUTES=${AUTO_IMPORT_INTERVAL_MINUTES:-5}
      - AUTO_IMPORT_ALLOW_OVERWRITE=${AUTO_IMPORT_ALLOW_OVERWRITE:-false}
      - AUTO_IMPORT_BLOCKED_PACKS=${AUTO_IMPORT_BLOCKED_PACKS:-true}
      - ARR_DOWNLOADS_PATH=${ARR_DOWNLOADS_PATH:-/media/downloads/complete}
    depends_on:
      arrmada-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Frontend (Next.js) ──────────────────────────────────────
  # NEXT_PUBLIC_API_URL must be the URL the USER's BROWSER uses to
  # reach the backend — NOT the Docker-internal hostname.
  # Default: http://localhost:8420 (same machine, default port)
  arrmada-frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8420}
    container_name: arrmada-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3420}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8420}
    depends_on:
      arrmada-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── PostgreSQL ──────────────────────────────────────────────
  # Integrated by default. To use an EXTERNAL PostgreSQL instead,
  # remove this service and set DATABASE_URL in the backend env.
  arrmada-db:
    image: postgres:16-alpine
    container_name: arrmada-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arrmada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arrmada}
      POSTGRES_DB: arrmada
    volumes:
      - arrmada-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrmada"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # Port NOT exposed by default (only accessible inside Docker network)
    # Uncomment to access from host tools (pgAdmin, DBeaver, etc.):
    # ports:
    #   - "5432:5432"

  # ── Caméras Eufy (optionnel) ────────────────────────────────
  # Pont vers le cloud Eufy : publie les détections sur le réseau local
  # (ws://<IP>:${EUFY_WS_PORT}). Démarré seulement à la demande :
  #   docker compose --profile eufy up -d eufy-security-ws
  # Compte Eufy SECONDAIRE (invité par le compte principal), sans 2FA.
  # Réseau « host » : le conteneur écoute DIRECTEMENT sur un port du NAS (pas
  # de correspondance de ports possible). Défaut 8424, à côté des 8420 d'ArrMada
  # (3000, le défaut du pont, est souvent déjà pris). Vérifier qu'il est libre :
  #   ss -ltn | grep -w 8424
  eufy-security-ws:
    image: bropat/eufy-security-ws:latest
    container_name: eufy-security-ws
    profiles: ["eufy"]
    restart: unless-stopped
    network_mode: host  # liaison directe avec la HomeBase (P2P)
    environment:
      - USERNAME=${EUFY_USERNAME:-}
      - PASSWORD=${EUFY_PASSWORD:-}
      - COUNTRY=${EUFY_COUNTRY:-FR}
      - TRUSTED_DEVICE_NAME=arrmada
      - PORT=${EUFY_WS_PORT:-8424}
    volumes:
      - ./data/eufy:/data

volumes:
  arrmada-pgdata:

networks:
  default:
    name: arrmada-network
