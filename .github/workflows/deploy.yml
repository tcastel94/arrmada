name: ArrMada Release

# ────────────────────────────────────────────────────────────────
# Publie l'image unique multi-architecture sur GHCR :
#   ghcr.io/<owner>/arrmada:latest       ← chaque push sur main
#   ghcr.io/<owner>/arrmada:<sha>        ← chaque push sur main
#   ghcr.io/<owner>/arrmada:1.2.3 / 1.2  ← tag git v1.2.3
# amd64 (PC, serveurs, Synology Intel/AMD) + arm64 (Synology ARM64,
# Raspberry Pi 4/5, Mac Apple Silicon).
#
# Puis (push sur main uniquement) déploie sur l'hôte Unraid via SSH.
#
# ⚠️ Premier push : le paquet GHCR est créé PRIVÉ. Pour que n'importe qui
#    puisse faire `docker compose pull` : GitHub → Packages → arrmada →
#    Package settings → Change visibility → Public.
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force full rebuild (no cache)"
        required: false
        default: "false"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/arrmada

jobs:
  # ── Build & Push (multi-arch) ─────────────────────────────
  build:
    name: "🐳 Build & push image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU : émule arm64 pour les étapes Python. L'étape Next.js tourne
      # nativement en amd64 (voir --platform=$BUILDPLATFORM du Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}

  # ── Deploy to Unraid ──────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Unraid"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UNRAID_HOST }}
          username: ${{ secrets.UNRAID_USER }}
          key: ${{ secrets.UNRAID_SSH_KEY }}
          port: ${{ secrets.UNRAID_SSH_PORT || 22 }}
          script: |
            set -e
            cd /mnt/user/appdata/arrmada

            # Garde-fou : sans l'override local (PostgreSQL existant, montage
            # /mnt/user, PUID 99/100), le compose par défaut démarrerait sur une
            # base SQLite VIDE. Voir docs/deploy-unraid.md.
            if [ ! -f docker-compose.override.yml ]; then
              echo "❌ docker-compose.override.yml absent — voir docs/deploy-unraid.md"
              exit 1
            fi

            echo "📦 Pulling latest code..."
            git pull origin main

            # Tant que le paquet GHCR est privé, le pull échoue : l'override
            # (build: .) fait alors construire l'image sur place. --build ne
            # change rien pour un service sans section build.
            echo "🐳 Pulling latest image..."
            docker compose pull 2>/dev/null || echo "ℹ️ Image non récupérable : construction locale"

            echo "🔄 Restarting..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "⏳ Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3420/api/health > /dev/null 2>&1; then
                echo "✅ ArrMada is healthy!"
                docker compose ps
                exit 0
              fi
              sleep 3
            done
            echo "⚠️ Health check failed — logs:"
            docker logs arrmada --tail 50
            exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployed commit ${{ github.sha }} to Unraid"
          echo "   ArrMada: http://${{ secrets.UNRAID_HOST }}:3420"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed for commit ${{ github.sha }}"
          echo "   Check the logs above for details"
