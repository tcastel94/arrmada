name: ArrMada Deploy

# ────────────────────────────────────────────────────────────────
# Triggered on push to main (after CI passes) or manually.
# Builds Docker images, pushes to GHCR, then triggers a
# deploy webhook on the Unraid host to pull & restart containers.
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force full rebuild (no cache)"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ── Build & Push Backend ──────────────────────────────────
  build-backend:
    name: "🔧 Build Backend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}

  # ── Build & Push Frontend ─────────────────────────────────
  build-frontend:
    name: "🎨 Build Frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8420' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}

  # ── Deploy to Unraid ──────────────────────────────────────
  deploy:
    name: "🚀 Deploy to Unraid"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UNRAID_HOST }}
          username: ${{ secrets.UNRAID_USER }}
          key: ${{ secrets.UNRAID_SSH_KEY }}
          port: ${{ secrets.UNRAID_SSH_PORT || 22 }}
          script: |
            set -e
            cd /mnt/user/appdata/arrmada

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🐳 Pulling latest images..."
            docker compose pull 2>/dev/null || true

            echo "🔄 Rebuilding and restarting..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "⏳ Waiting for health check..."
            sleep 15

            echo "✅ Checking services..."
            docker compose ps
            
            # Verify backend health
            if curl -sf http://localhost:8420/api/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
            else
              echo "⚠️ Backend health check failed — check logs with: docker logs arrmada-backend"
            fi

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployed commit ${{ github.sha }} to Unraid"
          echo "   Backend: http://${{ secrets.UNRAID_HOST }}:8420"
          echo "   Frontend: http://${{ secrets.UNRAID_HOST }}:3420"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed for commit ${{ github.sha }}"
          echo "   Check the logs above for details"
