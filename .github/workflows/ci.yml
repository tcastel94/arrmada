name: ArrMada CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────
  backend-lint-test:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        # Version figée : chaque nouvelle version de ruff peut ajouter des
        # règles et casser la CI sans aucun changement de code. On monte la
        # version volontairement (et on corrige) plutôt que de la subir.
        run: |
          pip install ruff==0.17.0
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run tests with coverage
        # `python -m` puts backend/ on sys.path (tests import the `app` package)
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Frontend ───────────────────────────────────────────────
  frontend-lint-build:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Installeur ─────────────────────────────────────────────
  installer:
    name: "Installer — shellcheck & dry-run"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck install.sh docker/entrypoint.sh docker/arrmada-cli deploy.sh scripts/bascule_arrmada.sh

      - name: Dry-run on every platform
        run: |
          for platform in linux synology unraid macos; do
            for torrent in deluge qbittorrent none; do
              echo "::group::${platform} / ${torrent}"
              ARRMADA_PLATFORM=$platform ./install.sh --dry-run --yes --torrent $torrent > out.log 2>&1 \
                || { cat out.log; exit 1; }
              grep -q "name: arrmada-stack" out.log
              echo "::endgroup::"
            done
          done

      - name: Dry-run under bash 3.2 (macOS)
        run: |
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" -e ARRMADA_PLATFORM=macos -e HOME=/Users/ci \
            bash:3.2 bash /install.sh --dry-run --yes --torrent qbittorrent

  # ── Add-on Kodi ────────────────────────────────────────────
  # Pas de Kodi en CI : on teste la logique pure et la cohérence des fichiers
  # (XML ↔ Python ↔ textures ↔ polices SiLVO). Le rendu se valide sur la TV.
  kodi-addon-test:
    name: "Kodi add-on — Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install pytest==8.3.4 ruff==0.17.0

      - name: Lint with ruff
        # Config : kodi-addon/ruff.toml. Seuls les modules des écrans v2,
        # les outils et les tests sont contrôlés (l'ancien code suivra).
        run: |
          LIB=kodi-addon/script.arrmada/lib
          FILES="$LIB/home_data.py $LIB/home_window.py $LIB/screens_data.py $LIB/ui_common.py"
          FILES="$FILES $LIB/detail_window.py $LIB/downloads_window.py $LIB/salon_window.py"
          FILES="$FILES $LIB/pairing_data.py $LIB/device.py $LIB/pair_window.py"
          FILES="$FILES $LIB/feeds.py $LIB/catalog_data.py $LIB/listing.py $LIB/background.py"
          FILES="$FILES $LIB/navigation.py $LIB/startup_guard.py $LIB/links_data.py $LIB/qr_window.py"
          FILES="$FILES $LIB/migration.py $LIB/library_data.py $LIB/playback_data.py"
          FILES="$FILES $LIB/watch_data.py $LIB/kodi_library.py $LIB/series_window.py"
          FILES="$FILES $LIB/shell_data.py $LIB/shell_window.py $LIB/grid_window.py"
          FILES="$FILES $LIB/apps_data.py $LIB/kodi_sources.py $LIB/apps_window.py"
          FILES="$FILES $LIB/camera_data.py $LIB/camera_window.py"
          FILES="$FILES $LIB/sync_data.py $LIB/watch_sync.py $LIB/upnext_data.py $LIB/upnext_window.py"
          FILES="$FILES $LIB/player_data.py $LIB/player_window.py $LIB/chapter_data.py $LIB/skip_window.py $LIB/mkv_chapters.py"
          FILES="$FILES $LIB/tonight_data.py $LIB/remote_data.py $LIB/crash_report.py"
          FILES="$FILES $LIB/download_data.py $LIB/download_window.py"
          FILES="$FILES $LIB/board_data.py $LIB/unstick_window.py"
          FILES="$FILES $LIB/ready_data.py $LIB/ready_window.py"
          FILES="$FILES $LIB/toast_data.py $LIB/toast.py"
          FILES="$FILES kodi-addon/tests kodi-addon/tools"
          ruff check $FILES
          ruff format --check $FILES

      - name: Run tests
        run: pytest kodi-addon/tests -v

  # ── Docker ─────────────────────────────────────────────────
  # Construit l'image unique (sans la publier) puis la démarre pour de
  # vrai : passerelle + API + interface doivent répondre sur :3420.
  docker-build:
    name: "Docker — Build & smoke test"
    runs-on: ubuntu-latest
    # Lancé sur chaque PR (pas seulement sur main) et en parallèle des jobs
    # de lint : l'image unique se valide par son propre test de démarrage.

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.postgres.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arrmada:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name arrmada-ci -p 3420:3420 arrmada:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3420/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3420/api/setup/status | tee /dev/stderr | grep -q '"password_set":false'
          curl -sf -o /dev/null http://localhost:3420/login
          docker logs arrmada-ci
