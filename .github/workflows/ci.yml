name: ArrMada CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────
  backend-lint-test:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run tests with coverage
        # `python -m` puts backend/ on sys.path (tests import the `app` package)
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term-missing -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Frontend ───────────────────────────────────────────────
  frontend-lint-build:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Installeur ─────────────────────────────────────────────
  installer:
    name: "Installer — shellcheck & dry-run"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck install.sh docker/entrypoint.sh docker/arrmada-cli deploy.sh

      - name: Dry-run on every platform
        run: |
          for platform in linux synology unraid macos; do
            for torrent in deluge qbittorrent none; do
              echo "::group::${platform} / ${torrent}"
              ARRMADA_PLATFORM=$platform ./install.sh --dry-run --yes --torrent $torrent > out.log 2>&1 \
                || { cat out.log; exit 1; }
              grep -q "name: arrmada-stack" out.log
              echo "::endgroup::"
            done
          done

      - name: Dry-run under bash 3.2 (macOS)
        run: |
          docker run --rm -v "$PWD/install.sh:/install.sh:ro" -e ARRMADA_PLATFORM=macos -e HOME=/Users/ci \
            bash:3.2 bash /install.sh --dry-run --yes --torrent qbittorrent

  # ── Docker ─────────────────────────────────────────────────
  # Construit l'image unique (sans la publier) puis la démarre pour de
  # vrai : passerelle + API + interface doivent répondre sur :3420.
  docker-build:
    name: "Docker — Build & smoke test"
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.postgres.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arrmada:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name arrmada-ci -p 3420:3420 arrmada:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3420/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3420/api/setup/status | tee /dev/stderr | grep -q '"password_set":false'
          curl -sf -o /dev/null http://localhost:3420/login
          docker logs arrmada-ci
