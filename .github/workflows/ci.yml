name: ArrMada CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────
  backend-lint-test:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        # Version figée : chaque nouvelle version de ruff peut ajouter des
        # règles et casser la CI sans aucun changement de code. On monte la
        # version volontairement (et on corrige) plutôt que de la subir.
        run: |
          pip install ruff==0.17.0
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v
        env:
          ARRMADA_AUTH_SECRET: changeme_use_a_strong_password
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Frontend ───────────────────────────────────────────────
  frontend-lint-build:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8420

  # ── Add-on Kodi ────────────────────────────────────────────
  # Pas de Kodi en CI : on teste la logique pure et la cohérence des fichiers
  # (XML ↔ Python ↔ textures ↔ polices SiLVO). Le rendu se valide sur la TV.
  kodi-addon-test:
    name: "Kodi add-on — Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install pytest==8.3.4 ruff==0.17.0

      - name: Lint with ruff
        # Config : kodi-addon/ruff.toml. Seuls les modules des écrans v2,
        # les outils et les tests sont contrôlés (l'ancien code suivra).
        run: |
          LIB=kodi-addon/script.arrmada/lib
          FILES="$LIB/home_data.py $LIB/home_window.py $LIB/screens_data.py $LIB/ui_common.py"
          FILES="$FILES $LIB/detail_window.py $LIB/downloads_window.py $LIB/salon_window.py"
          FILES="$FILES $LIB/pairing_data.py $LIB/device.py $LIB/pair_window.py"
          FILES="$FILES kodi-addon/tests kodi-addon/tools"
          ruff check $FILES
          ruff format --check $FILES

      - name: Run tests
        run: pytest kodi-addon/tests -v

  # ── Docker ─────────────────────────────────────────────────
  docker-build:
    name: "Docker — Build"
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build, kodi-addon-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t arrmada-backend ./backend

      - name: Build docker-compose stack
        run: docker compose config --quiet
